spring.application.name=backend

# Railway injecte PORT dynamiquement ; 8080 en local
server.port=${PORT:8080}

# PostgreSQL (Railway en prod, docker-compose en local) — fournis via variables d'environnement, jamais en dur
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:beloved_designs}?currentSchema=beloved_designs
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate ne doit jamais modifier le schema en prod : Flyway s'en charge
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=beloved_designs
spring.flyway.default-schema=beloved_designs
spring.flyway.locations=classpath:db/migration

# JWT — JWT_SECRET doit être défini explicitement en prod (pas de valeur par défaut acceptable)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
app.jwt.access-token-expiration-ms=900000
app.jwt.refresh-token-expiration-ms=604800000

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Origine(s) autorisées pour le frontend (séparées par des virgules en prod)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
