services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: beloved_designs
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: beloved_designs
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  data:
    build: ./data
    profiles: ["data"]          # ne démarre pas avec un simple "docker compose up"
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /app/dbt
    environment:
      DB_HOST: db               # dans Docker, la base s'appelle "db", pas "localhost"
      DB_PORT: 5432
      DB_NAME: beloved_designs
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DBT_PROFILES_DIR: /app/dbt
    volumes:
      - ./data:/app             # tes modifications sont visibles sans rebuild
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
